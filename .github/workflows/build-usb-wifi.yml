name: Build YASK USB WiFi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 zip python3-kerberos git

      - name: Clone YASK kernel source
        run: |
          git clone --recursive --depth=1 --branch builder https://github.com/topnotchfreaks/kernel_msm-5.15.git kernel

      - name: Setup Android kernel build
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          rm -rf .repo common
          aria2c -x 16 -s 16 -o clang.tar.gz https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -f clang.tar.gz
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' kernel/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' kernel/build.config.gki || true

      - name: Enable USB WiFi drivers
        working-directory: kernel
        run: |
          CONFIG=arch/arm64/configs/gki_defconfig
          cat >> "$CONFIG" <<'EOF'
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_USB=y
          CONFIG_USB_NET_RNDIS_WLAN=y
          # Mediatek MT7601U - তোর 1st dongle
          CONFIG_MT7601U=y
          # Ralink RT5370
          CONFIG_RT2X00=y
          CONFIG_RT2500USB=y
          CONFIG_RT73USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          EOF
          cat "$CONFIG"

      - name: Build kernel
        working-directory: kernel
        run: |
          ./build/build.sh -j$(nproc)
          
      - name: Upload AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: YASK-USB-WiFi
          path: kernel/out/dist/*.zip
